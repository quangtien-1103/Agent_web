<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Tạo bài đọc tiếng Anh phù hợp trình độ và luyện đọc hiểu.">
    <title>Reading — English Web</title>
    <link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages/reading.css">
    <script type="module" src="js/pages/reading.js"></script>
  </head>
  <body><div data-navbar></div><main class="container page-shell">
    <header class="page-heading"><span class="eyebrow">READ A LITTLE MORE · 03</span><h1>Mở một trang mới.</h1><p>Chọn trình độ và chủ đề. Bài đọc sẽ vừa sức và gần với điều bạn quan tâm.</p></header>
    <form class="reading-options" id="reading-form"><label>Trình độ<select name="level"><option>A1</option><option>A2</option><option selected>B1</option><option>B2</option><option>C1</option></select></label><label>Chủ đề<select name="topic"><option>Công nghệ</option><option>Du lịch</option><option>Thiên nhiên</option><option>Văn hóa</option><option>Sức khỏe</option><option>Công việc</option><option>Đời sống</option></select></label><button class="button button-primary" type="submit">Tạo bài đọc <span aria-hidden="true">→</span></button></form>
    <div id="reading-result" aria-live="polite"><div class="empty-card reading-empty"><span class="empty-illustration">文</span><h2>Một câu chuyện mới</h2><p>Bài đọc và câu hỏi sẽ xuất hiện ở đây.</p></div></div>
    <aside class="word-popover" id="word-popover" hidden aria-live="polite"></aside>
  </main><div data-footer></div></body>
</html>
