<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Tra cứu cấu trúc ngữ pháp và luyện sửa câu tiếng Anh.">
    <title>Ngữ pháp — English Web</title>
    <link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/pages/grammar.css">
    <script type="module" src="js/pages/grammar.js"></script>
  </head>
  <body><div data-navbar></div><main class="container page-shell">
    <header class="page-heading"><span class="eyebrow">MAKE IT MAKE SENSE · 02</span><h1>Ngữ pháp, <span>thật dễ hiểu.</span></h1><p>Học cấu trúc trong ngữ cảnh và tìm cách diễn đạt tự nhiên hơn.</p></header>
    <div class="tabs" role="tablist" aria-label="Công cụ ngữ pháp"><button class="tab-button is-active" id="lookup-tab" role="tab" aria-selected="true" aria-controls="lookup-panel">Tra cấu trúc</button><button class="tab-button" id="check-tab" role="tab" aria-selected="false" aria-controls="check-panel">Kiểm tra câu của tôi</button></div>
    <section class="tab-panel" id="lookup-panel" role="tabpanel" aria-labelledby="lookup-tab"><form class="search-bar" id="grammar-search"><label class="sr-only" for="grammar-input">Cấu trúc ngữ pháp</label><span aria-hidden="true">⌕</span><input id="grammar-input" placeholder="Ví dụ: present perfect" required><button class="button button-primary" type="submit">Tìm hiểu <span aria-hidden="true">→</span></button></form><div id="grammar-result" aria-live="polite"></div></section>
    <section class="tab-panel" id="check-panel" role="tabpanel" aria-labelledby="check-tab" hidden><form id="sentence-form" class="sentence-form"><label for="sentence-input">Viết câu bạn muốn kiểm tra</label><textarea id="sentence-input" rows="4" placeholder="Ví dụ: I have went to London last year." required></textarea><button class="button button-primary" type="submit">Kiểm tra câu <span aria-hidden="true">→</span></button></form><div id="sentence-result" aria-live="polite"></div></section>
  </main><div data-footer></div></body>
</html>
